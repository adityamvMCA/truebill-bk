name: Deploy TrueBill API

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_KEY }}

      - name: Add VPS host
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -p ${{ secrets.VPS_PORT }} \
            ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy backend
        run: |
          ssh -p ${{ secrets.VPS_PORT }} \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} \
            'set -eu
             cd /var/www/truebill-api
             git fetch origin main
             git reset --hard origin/main
             npm ci --omit=dev
             sudo -n -u root /usr/bin/env PM2_HOME=/root/.pm2 /usr/bin/pm2 restart truebill-api --update-env
             sleep 5
             curl --fail --silent --show-error \
               http://127.0.0.1:5001/api/health
             echo
             echo "TrueBill API deployment and health check succeeded."'

      - name: Notify users if app version changed
        if: success()
        run: |
          ssh -p ${{ secrets.VPS_PORT }} \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} \
            'set -eu
             set -a
             source /root/.truebill-deploy.env
             set +a
             bash /var/www/truebill-api/scripts/notify-app-update.sh'

      - name: Deployment successful
        run: echo "TrueBill API deployed successfully"